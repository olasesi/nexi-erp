apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexi-erp
  namespace: default
  labels:
    app: nexi-erp
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: nexi-erp
  template:
    metadata:
      labels:
        app: nexi-erp
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "80"
        prometheus.io/path: "/api/metrics"
    spec:
      volumes:
        - name: web-files
          emptyDir: {}
        - name: nginx-conf
          configMap:
            name: nexi-erp-nginx
      # The app image ships the full Laravel tree; nginx serves files from a
      # shared volume populated here so both containers see identical content.
      initContainers:
        - name: web-copy
          image: registry.example.com/nexi-erp:latest
          imagePullPolicy: Always
          command: ["sh", "-c", "cp -a /var/www/html/. /shared/www/"]
          volumeMounts:
            - name: web-files
              mountPath: /shared/www
      containers:
        - name: app
          image: registry.example.com/nexi-erp:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 9000
          env:
            - name: APP_ENV
              value: "production"
            - name: APP_DEBUG
              value: "false"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: nexi-erp-db
                  key: host
            - name: DB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: nexi-erp-db
                  key: database
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: nexi-erp-db
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nexi-erp-db
                  key: password
            - name: REDIS_HOST
              value: nexi-erp-redis
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: nexi-erp-app
                  key: key
            - name: SENTRY_LARAVEL_DSN
              valueFrom:
                secretKeyRef:
                  name: nexi-erp-app
                  key: sentry_dsn
                  optional: true
            - name: SENTRY_TRACES_SAMPLE_RATE
              value: "0.25"
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: web-files
              mountPath: /var/www/html
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
          livenessProbe:
            httpGet:
              path: /up
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: nexi-erp
  namespace: default
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "80"
    prometheus.io/path: "/api/metrics"
spec:
  selector:
    app: nexi-erp
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexi-erp
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
    - host: api.nexi-erp.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nexi-erp
                port:
                  number: 80
  tls:
    - hosts:
        - api.nexi-erp.com
      secretName: nexi-erp-tls