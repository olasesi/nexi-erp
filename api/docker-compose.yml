version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexi-erp-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    depends_on:
      - db
      - redis
    networks:
      - nexi-erp

  web:
    image: nginx:alpine
    container_name: nexi-erp-web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - app
    networks:
      - nexi-erp

  db:
    image: mysql:8.0
    container_name: nexi-erp-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-nexi_erp}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_USER: ${DB_USERNAME:-nexi}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/custom.cnf
    networks:
      - nexi-erp

  redis:
    image: redis:7-alpine
    container_name: nexi-erp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - nexi-erp

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexi-erp-queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --tries=3 --timeout=90
    volumes:
      - ./:/var/www/html
    depends_on:
      - db
      - redis
    networks:
      - nexi-erp

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexi-erp-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: php -d memory_limit=256M artisan schedule:work
    volumes:
      - ./:/var/www/html
    depends_on:
      - db
      - redis
    networks:
      - nexi-erp

volumes:
  db_data:
  redis_data:

networks:
  nexi-erp:
    driver: bridge
