    "Non-unique name."
    name: String!

    "Unique email address."
    email: String!

    "When the email was verified."
    email_verified_at: DateTime

    "When the account was created."
    created_at: DateTime!

    "When the account was last updated."
    updated_at: DateTime!
}

"A sales or purchase invoice."
type Invoice {
    "Unique primary key."
    id: ID!

    "Human-readable invoice number."
    invoice_number: String!

    "Whether this is a sales (`invoice`) or purchase (`bill`) document."
    type: String!

    "Lifecycle status (draft, sent, partial, paid, overdue, cancelled)."
    status: String!

    "ISO currency code."
    currency: String!

    "Date the invoice was issued."
    issue_date: Date

    "Date payment is due."
    due_date: Date

    "Net amount before tax and discounts."
    subtotal: Float!

    "Tax charged."
    tax_amount: Float!

    "Discount applied."
    discount_amount: Float!

    "Grand total."
    total: Float!

    "Amount already paid."
    paid_amount: Float!

    "Amount still outstanding."
    balance_due: Float!

    "When the record was created."
    created_at: DateTime!

    "When the record was last updated."
    updated_at: DateTime!
}

"A stock item or service offered by the company."
