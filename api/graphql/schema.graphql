"A datetime string with format `Y-m-d H:i:s`, e.g. `2018-05-23 13:43:32`."
scalar DateTime @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\DateTime")

"A date string with format `Y-m-d`, e.g. `2018-05-23`."
scalar Date @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\Date")

"Indicates what fields are available at the top level of a query operation."
type Query {
    "The authenticated staff account."
    me: User @auth(guard: "api")

    "Find a single user by primary key."
    user(id: ID! @eq): User @guard(with: ["api"]) @can(ability: "users.view", model: "App\\Models\\User") @find

    "List users, optionally filtered by name."
    users(
      "Filters by name. Accepts SQL LIKE wildcards `%` and `_`."
      name: String @where(operator: "like")
    ): [User!]! @guard(with: ["api"]) @can(ability: "users.view-any", model: "App\\Models\\User") @paginate(defaultCount: 15)

    "Find a single sales invoice by primary key."
    invoice(id: ID! @eq): Invoice @guard(with: ["api"]) @can(ability: "invoices.view", model: "App\\Models\\Invoice") @find

    "List sales invoices, newest first, optionally filtered by status or number."
    invoices(
      "Exact status match (draft, sent, partial, paid, overdue, cancelled)."
      status: String @eq

      "Case-insensitive match against the invoice number."
      search: String @where(operator: "like", key: "invoice_number")
    ): [Invoice!]! @guard(with: ["api"]) @can(ability: "invoices.view-any", model: "App\\Models\\Invoice") @orderBy(column: "issue_date", direction: DESC) @paginate(defaultCount: 15)

    "Find a single product by primary key."
    product(id: ID! @eq): Product @guard(with: ["api"]) @can(ability: "products.view", model: "App\\Models\\Product") @find

    "List products, optionally filtered by an active flag or a name match."
    products(
      "Exact match against the active flag."
      is_active: Boolean @eq

      "Case-insensitive match against the product name."
      search: String @where(operator: "like", key: "name")
    ): [Product!]! @guard(with: ["api"]) @can(ability: "products.view-any", model: "App\\Models\\Product") @paginate(defaultCount: 15)

    "Find a single contact by primary key."
    contact(id: ID! @eq): Contact @guard(with: ["api"]) @can(ability: "contacts.view", model: "App\\Models\\Contact") @find

    "List contacts, optionally filtered by type or a name match."
    contacts(
      "Exact match against the contact type."
      type: String @eq

      "Case-insensitive match against the last name."
      search: String @where(operator: "like", key: "last_name")
    ): [Contact!]! @guard(with: ["api"]) @can(ability: "contacts.view-any", model: "App\\Models\\Contact") @paginate(defaultCount: 15)
}

"Account of a person who uses this application."
