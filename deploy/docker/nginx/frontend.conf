server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Match the API's upload limit so large uploads are not rejected here first.
    client_max_body_size 64m;

    # Same-origin ingress: the SPA is served from this root and every backend
    # path is proxied to the Laravel web container (`web`), so the browser never
    # makes a cross-origin request and CORS is not involved.
    location /api/ {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /graphql {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded/attached files served through the API's storage symlink.
    location /storage/ {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
    }

    # Laravel health endpoint.
    location = /up {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
    }

    # SPA fallback - client-side routes are served by index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
    }

    access_log /var/log/nginx/nexi-erp-access.log;
    error_log /var/log/nginx/nexi-erp-error.log;
}
