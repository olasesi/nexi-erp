apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexi-erp-frontend
  namespace: default
  labels:
    app: nexi-erp-frontend
    tier: frontend
spec:
  replicas: 2
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: nexi-erp-frontend
  template:
    metadata:
      labels:
        app: nexi-erp-frontend
        tier: frontend
    spec:
      containers:
        - name: app
          image: registry.example.com/nexi-erp-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          # VITE_* values are compiled into the bundle at image build time.
          # Build the image with VITE_API_URL set (or leave it empty and route
          # /api through the ingress); container env cannot change the bundle.
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: nexi-erp-frontend
  namespace: default
spec:
  selector:
    app: nexi-erp-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: http
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexi-erp-frontend
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
spec:
  rules:
    - host: nexi-erp.com
      http:
        paths:
          # Same-origin API ingress: the SPA is built with an empty
          # VITE_API_URL and calls /api/* (and /storage/*) on this host, so the
          # ingress must send those to the Laravel Service, not to Nginx.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: nexi-erp
                port:
                  number: 80
          - path: /storage
            pathType: Prefix
            backend:
              service:
                name: nexi-erp
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nexi-erp-frontend
                port:
                  number: 80
  tls:
    - hosts:
        - nexi-erp.com
      secretName: nexi-erp-frontend-tls