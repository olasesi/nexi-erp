apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexi-erp-frontend
  namespace: default
  labels:
    app: nexi-erp-frontend
    tier: frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: nexi-erp-frontend
  template:
    metadata:
      labels:
        app: nexi-erp-frontend
        tier: frontend
    spec:
      containers:
        - name: app
          image: registry.example.com/nexi-erp-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: NEXT_PUBLIC_API_URL
              value: "http://nexi-erp:80"
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: nexi-erp-secrets
                  key: sentry-dsn
                  optional: true
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: nexi-erp-frontend
  namespace: default
spec:
  selector:
    app: nexi-erp-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexi-erp-frontend
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  rules:
    - host: nexi-erp.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nexi-erp-frontend
                port:
                  number: 80
  tls:
    - hosts:
        - nexi-erp.com
      secretName: nexi-erp-frontend-tls
