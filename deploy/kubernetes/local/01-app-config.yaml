# Runtime configuration shared by every Nexi ERP container.
#
# The ConfigMap holds non-sensitive values; the Secret uses stringData (plain
# text in the file, stored base64-encoded by Kubernetes).
#
# BEFORE APPLYING, fill in the Secret placeholders:
#   APP_KEY:     docker run --rm php:8.2-cli php -r "echo 'base64:'.base64_encode(random_bytes(32)).PHP_EOL;"
#   DB_PASSWORD / DB_ROOT_PASSWORD: any local values (they must match what MySQL
#   uses to create the database on first boot).
#
# PASSPORT_PASSWORD_CLIENT_ID / SECRET: leave empty for now - create the client
# once the stack is up, then patch them into this Secret (see README.md).
apiVersion: v1
kind: ConfigMap
metadata:
  name: nexi-erp-config
  namespace: nexi-erp
data:
  APP_NAME: Nexi ERP
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: http://localhost
  FRONTEND_URL: http://localhost
  LOG_CHANNEL: stderr
  LOG_LEVEL: warning
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_DATABASE: nexi_erp
  DB_USERNAME: nexi
  REDIS_CLIENT: phpredis
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  SESSION_DRIVER: database
  QUEUE_CONNECTION: redis
  CACHE_STORE: redis
  FILESYSTEM_DISK: public
  WEBHOOK_DRIVER: queue
---
apiVersion: v1
kind: Secret
metadata:
  name: nexi-erp-secrets
  namespace: nexi-erp
type: Opaque
stringData:
  APP_KEY: "REPLACE_ME_base64_key"
  DB_PASSWORD: "REPLACE_ME_db_password"
  DB_ROOT_PASSWORD: "REPLACE_ME_db_root_password"
  PASSPORT_PASSWORD_CLIENT_ID: ""
  PASSPORT_PASSWORD_CLIENT_SECRET: ""
