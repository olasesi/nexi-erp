# Redis for cache/queue/sessions. Ephemeral storage is fine locally -
# a cache/queue that resets on restart is acceptable in a lab.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: nexi-erp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--appendonly", "yes"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: nexi-erp
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
