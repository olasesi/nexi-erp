# Shared storage volume: Laravel's storage/ directory (uploads, logs, Passport
# keys) is used by the app, web, queue and scheduler pods, exactly like the
# shared "app_storage" volume in docker-compose.prod.yml. ReadWriteOnce is
# fine because the Docker Desktop cluster is single-node.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: app-storage
  namespace: nexi-erp
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
# One-shot init job: prepares the storage volume, runs migrations and generates
# the Passport keys (the same steps as the "init" container of
# docker-compose.prod.yml). To re-run it after code changes:
#   kubectl -n nexi-erp delete job nexi-erp-init
#   kubectl apply -f deploy/kubernetes/local/
apiVersion: batch/v1
kind: Job
metadata:
  name: nexi-erp-init
  namespace: nexi-erp
spec:
  backoffLimit: 4
  template:
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mysql 3306; do echo waiting for mysql; sleep 2; done"]
        - name: wait-for-redis
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z redis 6379; do echo waiting for redis; sleep 2; done"]
      containers:
        - name: init
          image: nexi-erp-api:lab
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: nexi-erp-config
            - secretRef:
                name: nexi-erp-secrets
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs storage/app/public bootstrap/cache
              chmod -R 0777 storage bootstrap/cache
              php artisan migrate --force
              php artisan passport:keys --force || true
              php artisan storage:link || true
              echo "nexi-erp init complete"
          volumeMounts:
            - name: storage
              mountPath: /var/www/html/storage
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: app-storage
---
# PHP-FPM application server. The Service MUST be named "app" because the
# nginx config baked into the web image (api/docker/nginx/conf.d/default.conf)
# proxies PHP requests to fastcgi_pass app:9000.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: nexi-erp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mysql 3306; do echo waiting for mysql; sleep 2; done"]
        - name: wait-for-redis
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z redis 6379; do echo waiting for redis; sleep 2; done"]
      containers:
        - name: app
          image: nexi-erp-api:lab
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: nexi-erp-config
            - secretRef:
                name: nexi-erp-secrets
          ports:
            - name: fpm
              containerPort: 9000
          readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: storage
              mountPath: /var/www/html/storage
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: app-storage
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: nexi-erp
spec:
  selector:
    app: app
  ports:
    - name: fpm
      port: 9000
      targetPort: fpm
