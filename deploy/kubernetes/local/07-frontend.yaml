# React SPA served as static files by nginx (built from the root Dockerfile).
# The bundle is built with VITE_API_URL="" so it calls /api/* on its own
# origin - the ingress routes those paths to the "web" backend service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: nexi-erp
spec:
  replicas: 2
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: app
          image: nexi-erp-frontend:lab
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: nexi-erp
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
