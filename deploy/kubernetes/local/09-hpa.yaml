# Optional: autoscale the frontend when CPU crosses 70%.
# Requires metrics-server (`kubectl top pods` must work). Docker Desktop ships
# one; if `kubectl top pods` errors, skip this file - it is a learning extra.
# Verify with:
#   kubectl -n nexi-erp apply -f deploy/kubernetes/local/09-hpa.yaml
#   kubectl -n nexi-erp get hpa -w
#   kubectl -n nexi-erp scale deployment/frontend --replicas=8  # then watch it scale back down
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend
  namespace: nexi-erp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
